# Compose de production du worker Jay Reach. À lancer depuis ce dossier :
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
# Le fichier d'environnement est créé à la main par l'opérateur (voir README.md).
services:
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-inconnu}
    image: jay-reach-worker:${GIT_SHA:-local}
    restart: unless-stopped
    env_file:
      - ${JAY_REACH_ENV_FILE:-/etc/jay-reach/worker.env}
    environment:
      GIT_SHA: ${GIT_SHA:-inconnu}
      HEARTBEAT_FILE: /tmp/jay-reach-battement
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/sante.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Navigateur dédié à LinkedIn (lot 4a). Son profil (cookies de la session) vit
  # sur un volume nommé. Il ne démarre pas sans LINKEDIN_PROXY_URL, pour ne
  # jamais sortir par l'IP publique du VPS. Réseau du projet uniquement : jamais
  # `vexa-lite-net`. Le port DevTools n'est publié que sur 127.0.0.1 : il donne la
  # main sur la session LinkedIn, il ne doit jamais être exposé.
  navigateur:
    # Facultatif : `up -d` ne le démarre que si COMPOSE_PROFILES=linkedin (voir README).
    profiles: ["linkedin"]
    build:
      context: ./navigateur
    image: jay-reach-navigateur:${GIT_SHA:-local}
    restart: unless-stopped
    # Ce fichier porte aussi les clés du worker : l'entrypoint lance Chromium avec
    # un environnement vidé (`env -i`), seul le proxy lui parvient.
    env_file:
      - ${JAY_REACH_ENV_FILE:-/etc/jay-reach/worker.env}
    ports:
      - "127.0.0.1:9222:9223"
    volumes:
      - profil-navigateur:/profil
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  profil-navigateur:
