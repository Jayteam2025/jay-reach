# Gitleaks configuration for Jay Reach
# Extends default rules and allowlists false positives

[extend]
useDefault = true

[allowlist]
regexes = [
  "VOTRE_CLE_ANON_PUBLIQUE",
  "VOTRE_TOKEN_CLI",
  "VOTRE-REF-PROJET",
  "VOTRE_MOT_DE_PASSE_DB",
  "linkedinSnapshot"
]
paths = [
  "docs/self-host.md",
  "docs/self-host.en.md",
  "supabase/functions/generate-prospect-messages-bulk/index.ts",
  "supabase/functions/regenerate-prospect-messages-from-template/index.ts",
  # Lockfiles : hashes d'integrite de dependances (faux positifs generic-api-key)
  "deno.lock",
  "pnpm-lock.yaml",
  # Catalogues de traductions : des libelles d'interface, jamais un secret. La regle
  # linkedin-client-secret s'y declenche sur des CLES qui contiennent « Linkedin » suivies de
  # leur libelle — par exemple "menuLinkedinJobChangeTitle": "Functiewijziging" (neerlandais).
  "v2/packages/i18n/src/messages/.*\\.json",
  # Harnais du chiffrement des credentials : des valeurs factices ecrites en clair
  # (« sk-secret-ABCD », « clef-chiffrement-32-octets-xxxxx »), c'est sa raison d'etre — il
  # verifie justement qu'une mauvaise cle ne dechiffre pas.
  "v2/test/pg-verify/credentials\\.sql"
]
