name: CI v2

# Chaine dediee au monorepo de la refonte, sous v2/. Le workflow CI principal
# couvre le socle actuel (racine) et ignore desormais v2/ : les deux mondes ont
# leur propre tsconfig, leur propre eslint et leur propre suite de tests.
#
# Ne se declenche que sur les chemins du v2. Une PR qui ne touche pas v2/ ne
# lance pas ce workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

permissions:
  contents: read

jobs:
  v2-lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
